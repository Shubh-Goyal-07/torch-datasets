[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-custom-datasets"
version = "1.0.0"
description = "PyTorch datasets for image, audio and tabular data from folders, CSV/Excel files and DataFrames, with splits and metric-learning wrappers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"

authors = [
  { name = "Shubh Goyal", email = "goyal.shubh0711@gmail.com" }
]

keywords = [
  "pytorch", "torch", "datasets", "dataloader", "deep-learning", "computer-vision",
  "image-classification", "image-segmentation", "audio-classification", "tabular",
  "metric-learning", "few-shot",
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  "torch>=2.1.0",
  "torchvision>=0.16.0",
  "torchaudio>=2.1.0",
  "soundfile>=0.12.1",
  "opencv-python-headless>=4.5.0",
  "numpy>=1.22.0",
  "pandas>=1.5.0",
  "openpyxl>=3.1.0",
  "scikit-learn>=1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "Pillow>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/Shubh-Goyal-07/torch-datasets"
Documentation = "https://github.com/Shubh-Goyal-07/torch-datasets#readme"
Source = "https://github.com/Shubh-Goyal-07/torch-datasets"
Tracker = "https://github.com/Shubh-Goyal-07/torch-datasets/issues"

[tool.setuptools.packages.find]
include = ["torchdatasets*"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "slow: marks tests that load real files or take >1s",
]
filterwarnings = [
  # A warning the package points at test code fails that test, unless the test expects it
  # (pytest.warns); third-party warnings are only reported.
  "error::UserWarning:tests",
]
