name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  # The publish workflow runs these tests before it uploads anything.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Coverage is measured once.
          - os: ubuntu-latest
            python-version: "3.12"
            coverage: true
          # Windows: paths with non-ASCII characters, backslashes and drive letters.
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The default PyPI wheels for Linux bundle CUDA (several GB); the tests only need the CPU
      # build. Windows wheels on PyPI are CPU-only already.
      - name: Install CPU-only PyTorch (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install the package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: python -m pytest -q --tb=short

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: python -m pytest -q --tb=short --cov=torchdatasets --cov-report=term-missing --cov-fail-under=80

  build:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Import the package from the built wheel
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          /tmp/wheel-env/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/python -c "import torchdatasets as td; from torchdatasets import audio, image, metric_learning, tabular, utils; print('torchdatasets', td.__version__)"
